# action.yml
name: 'amplify-get-outputs'
description: 'Gets some outputs from an Amplify deployment.'
inputs:
  app-id:
    description: 'The ID of the Amplify app.'
    required: true
    default: ''
  branch-name:
    description: 'The branch name.'
    required: true
    default: ''
outputs:
  graphql_endpoint:
    description: 'The GraphQL endpoint.'
  user_pool_id:
    description: 'The user pool ID.'
  user_pool_arn:
    description: 'The user pool ARN.'
  appsync_id:
    description: 'The appsync ID.'
  bucket_name:
    description: 'The bucket.'
  env_name:
    description: 'The environment name.'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.app-id }}
    - ${{ inputs.branch-name }}
branding:
  icon: 'check-circle'
  color: 'orange'
